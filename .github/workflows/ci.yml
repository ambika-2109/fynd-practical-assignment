name: Validate and deploy lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Terraform, verifier, IaC, and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terraform format, initialize, and validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Test verifier helpers
        run: python -m unittest discover -s tests -v

      - name: Scan IaC and source for misconfiguration and vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 fs
          --scanners misconfig,vuln --severity HIGH,CRITICAL --exit-code 1 /src

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
